AWSTemplateFormatVersion: '2010-09-09'
Description: CI/CD companion for the Week 4 AWS infrastructure capstone.
Parameters:
  ConnectionArn:
    Type: String
    Description: Authorized AWS CodeConnections connection ARN for GitHub.
  FullRepositoryId:
    Type: String
    Default: mimitrix123/week1-aws-cloud-project
  BranchName:
    Type: String
    Default: main
  DeploymentRoleArn:
    Type: String
    Description: Pre-created IAM role ARN that CloudFormation may assume to deploy the capstone stack.
  StackName:
    Type: String
    Default: week4-capstone
Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: [codepipeline.amazonaws.com] }
            Action: ['sts:AssumeRole']
      Policies:
        - PolicyName: pipeline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['s3:GetObject','s3:GetObjectVersion','s3:PutObject','s3:GetBucketVersioning']
                Resource: '*'
              - Effect: Allow
                Action: ['codeconnections:UseConnection']
                Resource: { Ref: ConnectionArn }
              - Effect: Allow
                Action: ['codebuild:StartBuild','codebuild:BatchGetBuilds']
                Resource: { Fn::GetAtt: [BuildProject, Arn] }
              - Effect: Allow
                Action: ['cloudformation:CreateStack','cloudformation:UpdateStack','cloudformation:DescribeStacks','cloudformation:DescribeStackEvents','cloudformation:SetStackPolicy','cloudformation:ValidateTemplate','cloudformation:CreateChangeSet','cloudformation:DescribeChangeSet','cloudformation:ExecuteChangeSet','cloudformation:DeleteChangeSet']
                Resource: '*'
              - Effect: Allow
                Action: ['iam:PassRole']
                Resource: { Ref: DeploymentRoleArn }
  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: [codebuild.amazonaws.com] }
            Action: ['sts:AssumeRole']
      Policies:
        - PolicyName: build-logs-and-artifacts
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['logs:CreateLogGroup','logs:CreateLogStream','logs:PutLogEvents']
                Resource: '*'
              - Effect: Allow
                Action: ['s3:GetObject','s3:GetObjectVersion','s3:PutObject']
                Resource: '*'
  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      ServiceRole: { Fn::GetAtt: [BuildRole, Arn] }
      Artifacts: { Type: CODEPIPELINE }
      Source: { Type: CODEPIPELINE }
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        Type: LINUX_CONTAINER
      TimeoutInMinutes: 10
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      RoleArn: { Fn::GetAtt: [PipelineRole, Arn] }
      ArtifactStore:
        Type: S3
        Location: { Ref: ArtifactBucket }
      Stages:
        - Name: Source
          Actions:
            - Name: GitHub
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: { Ref: ConnectionArn }
                FullRepositoryId: { Ref: FullRepositoryId }
                BranchName: { Ref: BranchName }
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: SourceOutput
        - Name: Validate
          Actions:
            - Name: CodeBuild
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: { Ref: BuildProject }
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: ValidatedOutput
        - Name: Deploy
          Actions:
            - Name: CloudFormation
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: '1'
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: { Ref: StackName }
                Capabilities: CAPABILITY_IAM,CAPABILITY_NAMED_IAM
                TemplatePath: ValidatedOutput::week4/mini-project-aws-infrastructure-automation/template.yaml
                RoleArn: { Ref: DeploymentRoleArn }
                OutputFileName: deployment-output.json
              InputArtifacts:
                - Name: ValidatedOutput
              OutputArtifacts:
                - Name: DeploymentOutput
Outputs:
  PipelineName:
    Value: { Ref: Pipeline }
  ArtifactBucket:
    Value: { Ref: ArtifactBucket }
